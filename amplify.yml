version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20
        - npm install
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*

# ── Custom headers ──────────────────────────────────────────────────────────
#
# REQUIRED env vars — set in Amplify Console → Environment variables BEFORE
# the first build. No account IDs, resource IDs, or project IDs belong here.
#
#   VITE_COGNITO_DOMAIN        Full origin, e.g. https://your-pool.auth.us-east-2.amazoncognito.com
#   VITE_API_GW_URL            Full origin, e.g. https://abc123xyz.execute-api.us-east-2.amazonaws.com
#   VITE_S3_FILES_BUCKET_URL   Full origin, e.g. https://your-bucket-name.s3.us-east-2.amazonaws.com
#
# Amplify substitutes ${VAR} references at deploy time. If a var is unset
# the literal "${VAR}" string appears in the header (safe but non-functional
# for that origin — fix by setting the var and redeploying).
#
# CSP NOTE: 'unsafe-inline' has been removed from script-src (AUTH-2 fix).
# Vite 8 production builds emit only external module scripts — no inline
# scripts are present in the built index.html, so the directive is safe to
# drop. style-src retains 'unsafe-inline' because @emotion/react (MUI) injects
# styles dynamically at runtime via <style> tags.
# ────────────────────────────────────────────────────────────────────────────

customHeaders:
  - pattern: '**/*'
    headers:
      - key: 'Strict-Transport-Security'
        value: 'max-age=31536000; includeSubDomains; preload'
      - key: 'X-Frame-Options'
        value: 'DENY'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
      - key: 'Permissions-Policy'
        value: 'camera=(), microphone=(), geolocation=(), interest-cohort=(), browsing-topics=(), payment=(), usb=(), serial=(), magnetometer=(), gyroscope=(), accelerometer=()'
      - key: 'Content-Security-Policy'
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: ${VITE_S3_FILES_BUCKET_URL}; connect-src 'self' ${VITE_API_GW_URL} ${VITE_COGNITO_DOMAIN} https://cognito-idp.us-east-2.amazonaws.com; font-src 'self' data:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self' ${VITE_COGNITO_DOMAIN}; worker-src 'self' blob:"
